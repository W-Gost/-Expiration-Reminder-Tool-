名称：使用 Conda 的 Python 包: Python Package using Conda

在：[推送]: [push]

职位：:
  构建 Linux：:
    运行环境：ubuntu-latest: ubuntu-latest
    策略：:
      max-parallel: 5: 5

    步骤：:
    - 用法：actions/checkout@v4uses: actions/checkout@v4
    - 名称：设置 Python 3.10name: Set up Python 3.10
      使用：actions/setup-python@v3: actions/setup-python@v3
      使用：:
        python-version: '3.10': '3.10'
    - 名称：将 conda 添加到系统路径name: Add conda to system path
      运行：|: |
        # $CONDA 是一个指向 miniconda 目录根目录的环境变量
        echo $CONDA/bin >> $GITHUB_PATH
    - 名称：安装依赖项name: Install dependencies
      运行：|: |
        conda env update --file environment.yml --name base
    - name: 使用 flake8 进行代码风格检查name: Lint with flake8
      运行：|: |
        conda install flake8
        # 如果存在 Python 语法错误或未定义名称，则停止构建
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero 将所有错误视为警告。GitHub 编辑器宽度为 127 个字符
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - 名称：使用 pytest 进行测试name: Test with pytest
      运行：|: |
        conda install pytest
        pytest
